name: Deploy Cast receiver

on:
  push:
    branches: [main]
    paths:
      - cast-receiver/**
      - .github/workflows/deploy-cast-receiver.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cast-receiver
      - id: deployment
        uses: actions/deploy-pages@v4
