<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YummyDroid Cast</title>
    <link rel="stylesheet" href="receiver.css">
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
    <main id="receiver" class="receiver receiver--idle">
        <video id="media" class="castMediaElement receiver__video"></video>

        <section class="receiver__idle" aria-label="YummyDroid">
            <img class="receiver__idle-logo" src="assets/app-logo.png" alt="">
            <div class="receiver__idle-name">YummyDroid</div>
            <div class="receiver__idle-status">Готово к трансляции</div>
        </section>

        <div class="receiver__scrim receiver__scrim--top"></div>
        <div class="receiver__scrim receiver__scrim--bottom"></div>

        <header class="receiver__header">
            <img class="receiver__brand" src="assets/app-logo.png" alt="">
            <div class="receiver__metadata">
                <h1 id="media-title" class="receiver__title">YummyDroid</h1>
                <p id="media-subtitle" class="receiver__subtitle"></p>
            </div>
        </header>

        <div class="receiver__loading" aria-hidden="true"></div>

        <div class="receiver__center-controls">
            <button id="previous" class="receiver__transport-button" type="button"
                aria-label="Предыдущая серия">
                <span class="receiver__previous-icon"></span>
            </button>
            <button id="play-pause" class="receiver__transport-button receiver__transport-button--primary"
                type="button" aria-label="Воспроизвести">
                <span class="receiver__play-icon"></span>
                <span class="receiver__pause-icon"><i></i><i></i></span>
            </button>
            <button id="next" class="receiver__transport-button" type="button"
                aria-label="Следующая серия">
                <span class="receiver__next-icon"></span>
            </button>
        </div>

        <section class="receiver__controls" aria-label="Управление воспроизведением">
            <div id="skip-controls" class="receiver__skip-controls" hidden>
                <button id="skip-segment" class="receiver__skip-button" type="button"></button>
                <button id="watch-segment" class="receiver__skip-button" type="button"></button>
            </div>

            <input id="timeline" class="receiver__timeline" type="range" min="0" max="1000"
                value="0" step="1" aria-label="Позиция воспроизведения">

            <div class="receiver__control-row">
                <div class="receiver__time-group">
                    <span id="current-time" class="receiver__current-time">0:00</span>
                    <span class="receiver__time-separator">/</span>
                    <span id="duration" class="receiver__duration">0:00</span>
                </div>

                <div class="receiver__selection-area">
                    <span id="source" class="receiver__source"></span>
                    <div id="selection-controls" class="receiver__selection-controls">
                        <button id="select-voice" class="receiver__selection-button" type="button" hidden>
                            <span id="voice-caption" class="receiver__selection-caption">Озвучка</span>
                            <span id="voice-value" class="receiver__selection-value"></span>
                        </button>
                        <button id="select-source" class="receiver__selection-button" type="button" hidden>
                            <span id="source-caption" class="receiver__selection-caption">Источник</span>
                            <span id="source-value" class="receiver__selection-value"></span>
                        </button>
                        <button id="select-quality" class="receiver__selection-button" type="button" hidden>
                            <span id="quality-caption" class="receiver__selection-caption">Качество</span>
                            <span id="quality-value" class="receiver__selection-value"></span>
                        </button>
                    </div>
                </div>

                <div class="receiver__status-group">
                    <button id="captions" class="receiver__captions" type="button"
                        aria-label="Субтитры">CC</button>
                </div>
            </div>
        </section>

        <section id="selection-menu" class="receiver__selection-menu" aria-modal="true" hidden>
            <h2 id="selection-menu-title" class="receiver__selection-menu-title"></h2>
            <div id="selection-options" class="receiver__selection-options" role="listbox"></div>
        </section>
    </main>
    <script src="skip-controls.js"></script>
    <script src="receiver.js"></script>
</body>
</html>
